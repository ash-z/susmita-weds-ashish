<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Clip Maker</title>
<style>
  :root { --bg: #111; --card: #1c1c1f; --fg: #eee; --muted: #999; --accent: #ffd640; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  form, .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input, select { background: #0d0d0f; color: var(--fg); border: 1px solid #333; border-radius: 8px;
                  padding: 9px 10px; font-size: 14px; }
  .drop { border: 2px dashed #444; border-radius: 12px; padding: 28px; text-align: center;
          margin-bottom: 18px; cursor: pointer; }
  .drop.has { border-color: var(--accent); }
  .checks { display: flex; gap: 18px; margin: 14px 0 4px; font-size: 14px; }
  .checks label { flex-direction: row; align-items: center; color: var(--fg); }
  button { margin-top: 16px; background: var(--accent); color: #111; border: 0; border-radius: 8px;
           padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  video { width: 100%; border-radius: 10px; background: #000; }
  a { color: var(--accent); }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <h1>Manga <span>Clip</span> Maker</h1>
  <p class="sub">Upload a manga PDF. Get short narrated clips of its best moments, with sound effects and music.</p>

  <form id="f">
    <div class="drop" id="drop">Drop a PDF here or click to choose
      <input type="file" name="pdf" id="pdf" accept="application/pdf" hidden>
    </div>
    <div class="grid">
      <label>Clips <input type="number" name="clips" value="1" min="1" max="10"></label>
      <label>Pages per clip <input type="number" name="pages" value="2" min="1" max="8"></label>
      <label>Target seconds <input type="number" name="seconds" value="45" min="15" max="180"></label>
      <label>Format
        <select name="format"><option value="vertical">Vertical 9:16 (Shorts/Reels)</option>
          <option value="landscape">Landscape 16:9</option><option value="square">Square 1:1</option></select></label>
      <label>Reading direction
        <select name="direction"><option value="rtl">Right-to-left (manga)</option>
          <option value="ltr">Left-to-right (comics/manhwa)</option></select></label>
      <label>Narrator style
        <select name="style"><option value="recap">Recap storyteller</option><option value="dramatic">Dramatic trailer</option>
          <option value="funny">Funny / witty</option><option value="hype">Anime hype</option></select></label>
      <label>Narration language <input name="language" value="English"></label>
      <label>Script writer
        <select name="engine"><option value="auto">Auto (Claude if API key set)</option>
          <option value="claude">Claude</option><option value="heuristic">Offline heuristic</option></select></label>
      <label>Voice engine
        <select name="tts"><option value="auto">Auto (best available)</option><option value="edge">Edge neural voices</option>
          <option value="piper">Piper (offline neural)</option><option value="gtts">Google TTS</option>
          <option value="pyttsx3">Offline system voice</option><option value="silent">Silent (test)</option></select></label>
      <label>Voice (optional) <input name="voice" placeholder="en-US-AndrewMultilingualNeural"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="captions" checked> Captions</label>
      <label><input type="checkbox" name="music" checked> Background music</label>
    </div>
    <button id="go" type="submit">Make clips</button>
  </form>

  <div class="card" id="status" hidden>
    <div id="log"></div>
    <div class="clips" id="clips"></div>
  </div>
</main>
<script>
const drop = document.getElementById('drop'), pdf = document.getElementById('pdf');
drop.onclick = () => pdf.click();
drop.ondragover = e => { e.preventDefault(); };
drop.ondrop = e => { e.preventDefault(); pdf.files = e.dataTransfer.files; pdf.onchange(); };
pdf.onchange = () => { if (pdf.files[0]) { drop.textContent = pdf.files[0].name; drop.classList.add('has'); drop.appendChild(pdf); } };

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  if (!pdf.files[0]) { alert('Choose a PDF first'); return; }
  const go = document.getElementById('go'), log = document.getElementById('log'), clips = document.getElementById('clips');
  go.disabled = true; clips.innerHTML = ''; log.textContent = 'Uploading…';
  document.getElementById('status').hidden = false;
  const res = await fetch('/jobs', { method: 'POST', body: new FormData(e.target) });
  const body = await res.json();
  if (!res.ok) { log.innerHTML = `<span class="err">${body.error}</span>`; go.disabled = false; return; }
  const poll = async () => {
    const j = await (await fetch(`/jobs/${body.id}`)).json();
    log.textContent = j.log.map(l => '• ' + l).join('\n');
    if (j.status === 'running') return setTimeout(poll, 1500);
    go.disabled = false;
    if (j.status === 'error') { log.innerHTML += `\n<span class="err">Error: ${j.error}</span>`; return; }
    for (const c of j.clips) {
      const url = `/jobs/${body.id}/files/${c}`;
      clips.insertAdjacentHTML('beforeend', `<div><video src="${url}" controls playsinline></video><a href="${url}" download>Download ${c}</a></div>`);
    }
    clips.insertAdjacentHTML('beforeend', `<div><a href="/jobs/${body.id}/files/script.json" target="_blank">View script.json</a></div>`);
  };
  poll();
};
</script>
</body>
</html>
